service: job-tracker

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    APPLICATIONS_TABLE: applications-${sls:stage}
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:Scan
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
          Resource:
            - Fn::GetAtt: [ApplicationsTable, Arn]
  # Every route below requires this key (x-api-key header) once deployed for
  # real. Locally, `npm run dev` passes --noAuth to serverless-offline, which
  # skips this check entirely, so local development needs no key.
  apiGateway:
    apiKeys:
      - name: job-tracker-key-${sls:stage}
    usagePlan:
      quota:
        limit: 5000
        period: MONTH
      throttle:
        burstLimit: 20
        rateLimit: 10

plugins:
  - serverless-esbuild
  - serverless-dynamodb
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 4000
  serverless-dynamodb:
    stages:
      - local
    start:
      port: 8000
      inMemory: false
      dbPath: ./.dynamodb-data
      migrate: true

functions:
  createApplication:
    handler: src/handlers/applications.create
    events:
      - http:
          path: applications
          method: post
          cors: true
          private: true

  listApplications:
    handler: src/handlers/applications.list
    events:
      - http:
          path: applications
          method: get
          cors: true
          private: true

  updateApplication:
    handler: src/handlers/applications.update
    events:
      - http:
          path: applications/{id}
          method: patch
          cors: true
          private: true

  deleteApplication:
    handler: src/handlers/applications.remove
    events:
      - http:
          path: applications/{id}
          method: delete
          cors: true
          private: true

resources:
  Resources:
    ApplicationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: applications-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH

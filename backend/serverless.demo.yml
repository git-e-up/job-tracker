# Separate, read-only backend for the public portfolio demo. Deployed
# independently from serverless.yml (the full-CRUD API) via:
#   npx serverless deploy --config serverless.demo.yml
#
# Only the list route exists — there is no create/update/delete function
# here at all, so there's no write route to find, key or no key. The
# Lambda's own IAM role only grants dynamodb:Scan, so even a crafted
# request couldn't write to this table. Seed data with scripts/seed-demo.mjs.
service: job-tracker-demo

frameworkVersion: "3"

provider:
  name: aws
  runtime: nodejs20.x
  region: us-east-1
  environment:
    APPLICATIONS_TABLE: applications-demo
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Scan
          Resource:
            - Fn::GetAtt: [ApplicationsTable, Arn]
        # AWS is changing CloudWatch Logs IAM authorization on 2027-04-26: a
        # Log Stream-format ARN (ending in :* or :log-stream:<name>) will no
        # longer grant Log Group-level actions, only the 4 actions actually
        # scoped to streams (PutLogEvents, GetLogEvents, CreateLogStream,
        # DeleteLogStream). serverless-offline/serverless-framework's own
        # auto-generated logging statement uses that stream-format ARN for
        # CreateLogGroup/TagResource too, which aren't stream-scoped — add an
        # explicit Log Group ARN (no trailing :*) grant for those so they
        # keep working after the change.
        - Effect: Allow
          Action:
            - logs:CreateLogGroup
            - logs:TagResource
          Resource:
            - Fn::Sub: "arn:aws:logs:${aws:region}:${aws:accountId}:log-group:/aws/lambda/${self:service}-${sls:stage}*"

plugins:
  - serverless-esbuild

functions:
  listApplications:
    handler: src/handlers/applications.list
    events:
      - http:
          path: applications
          method: get
          cors: true

resources:
  Resources:
    ApplicationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: applications-demo
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
